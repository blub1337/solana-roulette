[package]
name = "vrf-spike"
version = "0.0.0"
description = "THROWAWAY MagicBlock SolanaVrf feasibility spike. Never deployed with, and never a dependency of, the roulette program."
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "lib"]
name = "vrf_spike"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
# THE COMPATIBILITY PROOF. The money-moving roulette program is pinned to
# anchor-lang 0.30.1 and this spike deliberately uses the SAME version, so a
# successful build here is direct evidence that MagicBlock can be added to
# roulette without an Anchor upgrade.
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
ephemeral-vrf-sdk = { version = "=0.2.3", features = ["anchor"] }

# WHY 0.2.3 AND NOT THE NEWEST (0.17.3):
#
# Every release from 0.3.0 onward declares a HARD, non-optional
#   solana-program = "3.0.0"
# alongside an optional compat `solana-program ">=1.18.26, <3"`. anchor-lang
# 0.30.1 needs solana-program 1.18.26, whose crypto stack (curve25519-dalek
# 3.2.1) requires zeroize <1.4, while solana-program 3.0.0 pulls
# solana-secp256k1-recover 3 -> k256 0.13 -> elliptic-curve 0.13.6 which
# requires zeroize ^1.5. Those two requirements cannot be resolved in one
# graph, so `anchor-compat` does NOT save 0.3.0+: it is unresolvable, not
# merely incompatible, and no Anchor version in the 0.3x line avoids it.
#
# 0.2.3 declares the SAME `anchor-lang >=0.28.0` and `solana-program
# ">=1.18.26, <3"` WITHOUT the 3.0.0 requirement, so it unifies with
# anchor-lang 0.30.1. Its `anchor` feature is the whole feature surface
# (`anchor = ["anchor-lang"]`); there is no anchor-modern/anchor-compat split.
