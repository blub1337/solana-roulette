[package]
name = "roulette"
version = "0.1.0"
description = "Solana Roulette — devnet-first on-chain roulette with escrow, weighted entries and on-chain fee."
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "roulette"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
# init-if-needed: deposit() uses init_if_needed for the Participant PDA and
# guards re-entry itself (DuplicateDeposit when the wallet is already set).
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
sha2 = "0.10"

[dev-dependencies]
# anchor-client tests are wired in tests/roulette.ts via the TS harness
