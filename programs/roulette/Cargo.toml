[package]
name = "roulette"
version = "0.1.0"
description = "Solana Roulette — devnet-first on-chain roulette with escrow, weighted entries and on-chain fee."
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "roulette"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = "0.30.1"
sha2 = "0.10"

[dev-dependencies]
# anchor-client tests are wired in tests/roulette.ts via the TS harness
