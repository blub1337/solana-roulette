name: Deploy program to devnet

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Default cluster for every solana CLI command in this job — without it
      # `solana balance`/`airdrop` silently target MAINNET and read 0 SOL.
      SOLANA_URL: https://api.devnet.solana.com
    steps:
      - uses: actions/checkout@v4

      # Pinned to 1.82: cargo 1.83+ writes lockfile v4 by default, which the
      # 1.18 SBF toolchain cannot parse. Anchor's host `cargo metadata` pass
      # (re)writes programs/roulette/Cargo.lock before cargo-build-sbf runs.
      - name: Setup Rust (1.82)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.82.0

      # Pinned to 1.18.17: Anchor 0.30.1 defaults to this version for the SBF
      # build, so the BPF toolchain's cargo and any host cargo must agree on
      # Cargo.lock (v4 locks break the 1.18 cargo).
      - name: Setup Solana CLI (Anza, 1.18.17)
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v1.18.17/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Install Anchor (avm)
        run: |
          cargo install --git https://github.com/coral-xyz/anchor avm --locked
          avm install 0.30.1
          avm use 0.30.1

      - name: Show toolchain
        run: |
          solana --version
          anchor --version
          node --version

      - name: Import operator keypair
        env:
          OPERATOR_KEYPAIR_B64: ${{ secrets.OPERATOR_KEYPAIR_B64 }}
        run: |
          if [ -z "$OPERATOR_KEYPAIR_B64" ]; then
            echo "SECRET MISSING: OPERATOR_KEYPAIR_B64" >&2
            exit 1
          fi
          mkdir -p ~/.config/solana
          printf '%s' "$OPERATOR_KEYPAIR_B64" | base64 -d > ~/.config/solana/id.json
          chmod 600 ~/.config/solana/id.json
          solana-keygen pubkey ~/.config/solana/id.json

      - name: Fund wallet from devnet faucet (loop)
        run: |
          ADDR=$(solana-keygen pubkey ~/.config/solana/id.json)
          RPC=https://api.devnet.solana.com
          # Balance read straight from the devnet RPC (lamports) — immune to
          # CLI default-cluster mistakes.
          bal_lamports() {
            curl -s "$RPC" -X POST -H "Content-Type: application/json" \
              -d "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"getBalance\",\"params\":[\"$ADDR\"]}" \
              | grep -o '"value":[0-9]*' | head -1 | cut -d: -f2
          }
          for i in 1 2 3 4 5 6 7 8; do
            B=$(bal_lamports)
            echo "devnet balance: ${B:-0} lamports"
            if [ "${B:-0}" -ge 4000000000 ]; then echo "funded: $B lamports"; break; fi
            echo "airdrop attempt $i..."
            solana airdrop 2 "$ADDR" --url "$RPC" || true
            sleep 15
          done
          FINAL=$(bal_lamports)
          echo "final devnet balance: ${FINAL:-0} lamports"
          if [ "${FINAL:-0}" -lt 4000000000 ]; then
            echo "NOT ENOUGH DEVNET SOL — top up manually at https://faucet.solana.com to $ADDR and re-run" >&2
            exit 1
          fi

      # Deterministic program address: nacl keypair from
      # sha256("roulette-deploy-v1:" + OPERATOR_KEYPAIR_B64). Same secret in,
      # same program address out — the ID is reproducible across re-deploys.
      - name: Derive deterministic deploy keypair + pin program ID
        env:
          OPERATOR_KEYPAIR_B64: ${{ secrets.OPERATOR_KEYPAIR_B64 }}
        run: |
          mkdir -p target/deploy
          npm install --no-save tsx tweetnacl >/dev/null 2>&1
          node -e '
            const nacl = require("tweetnacl");
            const { createHash } = require("crypto");
            const seed = createHash("sha256").update("roulette-deploy-v1:" + process.env.OPERATOR_KEYPAIR_B64).digest();
            const kp = nacl.sign.keyPair.fromSeed(seed);
            require("fs").writeFileSync("target/deploy/roulette-keypair.json", JSON.stringify(Array.from(kp.secretKey)));
          '
          KP=target/deploy/roulette-keypair.json
          chmod 600 "$KP"
          PROGRAM_ID=$(solana-keygen pubkey "$KP")
          echo "PROGRAM_ID=$PROGRAM_ID" >> "$GITHUB_ENV"
          CURRENT=$(grep -o 'declare_id!("[^"]*")' programs/roulette/src/lib.rs | cut -d'"' -f2)
          echo "on-chain program id will be: $PROGRAM_ID (lib.rs has: $CURRENT)"
          if [ "$CURRENT" != "$PROGRAM_ID" ]; then
            sed -i "s/declare_id!(\"[^\"]*\")/declare_id!(\"$PROGRAM_ID\")/" programs/roulette/src/lib.rs
            grep -n 'declare_id!' programs/roulette/src/lib.rs
          fi
          grep -n "$PROGRAM_ID" Anchor.toml || { echo "Anchor.toml program id mismatch" >&2; exit 1; }

      # The host-cargo IDL pass rewrites programs/roulette/Cargo.lock to
      # lockfile v4, which the 1.18 SBF cargo cannot parse (-Znext-lockfile-bump
      # error in CI run 36206893044). Drop the lock and skip IDL generation.
      - name: Build program
        run: |
          rm -f programs/roulette/Cargo.lock
          anchor build --no-idl
          test -f target/deploy/roulette.so || { echo "roulette.so missing" >&2; exit 1; }
          ls -la target/deploy/

      - name: Deploy to devnet (deterministic program address)
        run: |
          solana program deploy target/deploy/roulette.so \
            --program-id target/deploy/roulette-keypair.json \
            --keypair ~/.config/solana/id.json \
            --url https://api.devnet.solana.com \
            --output json
          solana program show "$PROGRAM_ID"

      - name: Initialize on-chain config
        run: |
          npm install --no-save tsx >/dev/null 2>&1
          npx tsx scripts/seed-config.ts
        env:
          SOLANA_RPC_URL: https://api.devnet.solana.com
          OPERATOR_KEYPAIR: ${{ secrets.OPERATOR_KEYPAIR }}
          ROULETTE_PROGRAM_ID: ${{ env.PROGRAM_ID }}
          TREASURY_PUBKEY: 6B9MXLX4tgbHB9eXheHqK6FmPXCwxYP7No51NqRQHAaR

      - name: Output program ID
        run: |
          echo "DEPLOYED PROGRAM ID: $PROGRAM_ID"
          solana program show "$PROGRAM_ID"
          solana account "$PROGRAM_ID" --url https://api.devnet.solana.com || true
