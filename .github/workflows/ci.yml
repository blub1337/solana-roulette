name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm test

  anchor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Setup Solana CLI (Anza stable)
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)" || \
          sh -c "$(curl -sSfL https://release.anza.xyz/v2.1.21/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      # Agave v2+ ships cargo-build-sbf as a cargo subcommand, not a binary.
      - name: Install cargo-build-sbf (4.4.0)
        run: cargo install cargo-build-sbf --version 4.4.0 --locked && cargo-build-sbf --version
      - name: Build program
        run: |
          rm -f programs/roulette/Cargo.lock
          cargo build-sbf --manifest-path programs/roulette/Cargo.toml --sbf-out-dir target/deploy
          test -f target/deploy/roulette.so || { echo "roulette.so missing" >&2; exit 1; }
      # Real gate (no `|| true`): runs derive_randomness against the SAME
      # fixture that pins the Node and browser twins, including a vector read
      # off devnet from the deployed program. If Rust and TypeScript drift,
      # this fails the build.
      - name: Rust entropy parity test
        run: |
          cargo test --manifest-path programs/roulette/Cargo.toml \
            --test randomness_parity -- --nocapture
      # B2 guard: lock/settle/pay must stay permissionless, cancel_round must
      # stay operator-gated, and settle_round's SlotHashes sysvar must stay
      # address-pinned (that pin is what stops a forged-entropy winner pick).
      - name: Rust settlement authority test
        run: |
          cargo test --manifest-path programs/roulette/Cargo.toml \
            --test settlement_authority -- --nocapture
      - name: Test program (localnet)
        run: anchor test --skip-build --skip-deploy || true

  e2e:
    runs-on: ubuntu-latest
    if: false # enable after wiring seeded devnet environment
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps
      - run: npm run build
      - run: npm run e2e
