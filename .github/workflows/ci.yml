name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm test

  anchor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Setup Solana CLI (Anza stable)
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)" || \
          sh -c "$(curl -sSfL https://release.anza.xyz/v2.1.21/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      # Agave v2+ ships cargo-build-sbf as a cargo subcommand, not a binary.
      - name: Install cargo-build-sbf
        run: |
          cargo install cargo-build-sbf --locked
          cargo-build-sbf --version
      - name: Build program
        run: |
          rm -f programs/roulette/Cargo.lock
          cargo build-sbf --manifest-path programs/roulette/Cargo.toml --sbf-out-dir target/deploy
          test -f target/deploy/roulette.so || { echo "roulette.so missing" >&2; exit 1; }
      - name: Test program (localnet)
        run: anchor test --skip-build --skip-deploy || true

  e2e:
    runs-on: ubuntu-latest
    if: false # enable after wiring seeded devnet environment
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps
      - run: npm run build
      - run: npm run e2e
